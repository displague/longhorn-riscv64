name: build

# Pull requests (including the upstream-sync and Dependabot ones) build every image for riscv64.
# Pushes to main also publish ghcr.io/<owner>/longhorn-riscv64/<image>:<tag>-riscv64 and merge it
# with upstream's amd64/arm64 image into ghcr.io/<owner>/longhorn-riscv64/<image>:<tag>.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        image:
          - longhorn-manager
          - longhorn-engine
          - longhorn-instance-manager
          - csi-attacher
          - csi-provisioner
          - csi-resizer
          - csi-snapshotter
          - csi-node-driver-registrar
          - livenessprobe
    env:
      REGISTRY: ghcr.io/${{ github.repository }}
      CACHE: --cache-from type=gha,scope=${{ matrix.image }} --cache-to type=gha,mode=max,scope=${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64
      - uses: docker/setup-buildx-action@v3
      - name: Tag
        run: make tags | grep "^${{ matrix.image }} "
      # publish only from main; PRs and dispatches on other branches just build
      - name: Build
        if: github.ref != 'refs/heads/main'
        run: make build-${{ matrix.image }}
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push riscv64 image and merge with upstream
        if: github.ref == 'refs/heads/main'
        run: make manifest-${{ matrix.image }}
