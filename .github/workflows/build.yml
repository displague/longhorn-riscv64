name: build

# Pull requests (Dependabot's included) build every image for riscv64. Runs on main (pushes, and
# upstream-sync calling this after it commits a new Longhorn release) also publish
# ghcr.io/<owner>/longhorn-riscv64/<image>:<tag>-riscv64, merge it with upstream's amd64/arm64 image
# into ghcr.io/<owner>/longhorn-riscv64/<image>:<tag>, and, once every image is out, tag this repo
# longhorn-<version>.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: commit to build (upstream-sync passes the commit it just pushed)
        type: string
        required: false

permissions:
  contents: write
  packages: write
  id-token: write      # Sigstore keyless signing for the attestations
  attestations: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        image:
          - longhorn-manager
          - longhorn-engine
          - longhorn-instance-manager
          - longhorn-share-manager
          - csi-attacher
          - csi-provisioner
          - csi-resizer
          - csi-snapshotter
          - csi-node-driver-registrar
          - livenessprobe
    env:
      REGISTRY: ghcr.io/${{ github.repository }}
      CACHE: --cache-from type=gha,scope=${{ matrix.image }} --cache-to type=gha,mode=max,scope=${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: true
      # checkout fetches submodules shallow and without tags; the image tag is the submodule's tag
      - name: Fetch submodule tags
        run: git submodule foreach --quiet 'git fetch -q --depth=1 origin "+refs/tags/*:refs/tags/*"'
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: riscv64
      - uses: docker/setup-buildx-action@v3
      - name: Tag
        run: make tags | grep "^${{ matrix.image }} "
      # publish only from main; PRs and dispatches on other branches just build
      - name: Build
        if: github.ref != 'refs/heads/main'
        run: make build-${{ matrix.image }}
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push riscv64 image and merge with upstream
        id: publish
        if: github.ref == 'refs/heads/main'
        run: |
          make manifest-${{ matrix.image }}
          echo "riscv64=$(jq -r '."containerimage.digest"' out/${{ matrix.image }}.push.json)" >> "$GITHUB_OUTPUT"
          echo "merged=$(cat out/${{ matrix.image }}.merged.digest)" >> "$GITHUB_OUTPUT"
      # Signed SLSA provenance: this repo, commit and run built these digests.
      # Verify: gh attestation verify oci://ghcr.io/<owner>/longhorn-riscv64/<image>:<tag> --owner <owner>
      - name: Attest the riscv64 image
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.image }}
          subject-digest: ${{ steps.publish.outputs.riscv64 }}
          push-to-registry: true
      - name: Attest the merged multi-arch tag
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.image }}
          subject-digest: ${{ steps.publish.outputs.merged }}
          push-to-registry: true

  mirror:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [longhorn-ui, backing-image-manager, support-bundle-kit, longhorn-cli]
    env:
      REGISTRY: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy upstream's image (same digests)
        run: make mirror-${{ matrix.image }}

  release-tag:
    needs: [image, mirror]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: true
      - name: Tag the repo with the Longhorn release it published
        run: |
          git submodule foreach --quiet 'git fetch -q --depth=1 origin "+refs/tags/*:refs/tags/*"'
          v=longhorn-$(git -C upstream/longhorn-manager describe --tags --exact-match)
          if git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null; then
            echo "$v already tagged"
          else
            git tag "$v" && git push origin "refs/tags/$v" && echo "tagged $v"
          fi
